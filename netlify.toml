# Netlify must publish the Vite build output — static files like sitemap.xml
# live in dist/ (copied from public/ during `npm run build`).
[build]
  command = "npm run build"
  publish = "dist"

# Extensionless URLs -> actual HTML emitted by Vite (same as local dev middleware).
[[redirects]]
  from = "/qr-code-generator"
  to = "/qr-code-generator.html"
  status = 200

[[redirects]]
  from = "/barcode-scanner"
  to = "/barcode-scanner.html"
  status = 200

[[redirects]]
  from = "/barcode-generator"
  to = "/barcode-generator.html"
  status = 200

[[redirects]]
  from = "/image-qr-code-scanner"
  to = "/image-qr-code-scanner.html"
  status = 200

[[redirects]]
  from = "/wifi-qr-code-scanner"
  to = "/wifi-qr-code-scanner.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/blog/qr-code-scanner-not-working"
  to = "/blog/qr-code-scanner-not-working.html"
  status = 200

[[redirects]]
  from = "/blog/how-to-create-wifi-qr-code"
  to = "/blog/how-to-create-wifi-qr-code.html"
  status = 200

[[redirects]]
  from = "/blog/qr-code-vs-barcode"
  to = "/blog/qr-code-vs-barcode.html"
  status = 200

[[redirects]]
  from = "/blog/is-it-safe-to-scan-random-qr-codes"
  to = "/blog/is-it-safe-to-scan-random-qr-codes.html"
  status = 200

[[redirects]]
  from = "/blog/qr-code-marketing-ideas-for-small-business"
  to = "/blog/qr-code-marketing-ideas-for-small-business.html"
  status = 200

[[redirects]]
  from = "/about-us"
  to = "/about-us.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
